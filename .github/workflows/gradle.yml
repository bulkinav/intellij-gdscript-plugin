name: Build Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v4
    - name: Build, test, and verify plugin
      run: ./gradlew buildPlugin test verifyPlugin verifyPluginStructure
    - name: Upload plugin distribution
      uses: actions/upload-artifact@v4
      with:
        name: intellij-gdscript
        path: build/distributions/*.zip
